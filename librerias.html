<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>librerías</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div id="tareas"></div>
    
    <br><br><br>
    <h1 class="titulo">Librerías</h1>
    <br><br>
    <div class="librerias">
        <ul>
            <li>Librerías de arduino bloks: <a href="https://www.steamakersblocks.com/web/help/libraries" target="_blank">Ver</a>.</li>
        </ul>
    </div>
    <script>

    const div = document.getElemtById("tareas");

    fetch("barra.html")
      .then(response => response.text())
      .then(data => {
         div.innerHTML = data;
      })
    .catch(error => console.log("Error cargando barra:", error));
    </script>
</body>
</html>
