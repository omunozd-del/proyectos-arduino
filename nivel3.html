<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivel3</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div id="tareas"></div>
    
    <script>
        
  const div = document.getElementById("tareas");

  fetch("barra.html")
    .then(response => response.text())
    .then(data => {
        div.innerHTML = data;
    })
    .catch(error => console.log("Error cargando barra:", error));
    </script>
</body>
</html>
